name: Release candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full current main SHA approved by PO
        required: true
        type: string
      version:
        description: Expected version (first 0.1.0-alpha.1)
        required: true
        type: string
      confirmation:
        description: CANDIDATE <version> @ <full source_sha>
        required: true
        type: string
      mode:
        description: Plan is read-only; create-pr needs enablement and PO environment approval
        type: choice
        options: [plan, create-pr]
        default: plan
permissions: {}
concurrency:
  group: release-candidate
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.actor == 'anhh2j'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Plan with release-please 17.6.0, GET-only snapshot
        run: python3 scripts/release_control.py plan --sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: release-candidate-plan
          path: build/reports/release-candidate/
          if-no-files-found: error
  create-pr:
    needs: plan
    if: inputs.mode == 'create-pr' && vars.CANDIDATE_CREATION_ENABLED == 'true'
    environment: moneymate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      CANDIDATE_CREATION_ENABLED: ${{ vars.CANDIDATE_CREATION_ENABLED }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fresh Draft PR only, no tag/release/signing
        run: python3 scripts/release_control.py candidate --sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
