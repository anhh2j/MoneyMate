name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Build and required checks
        run: |
          mkdir -p build/reports/dod
          set -o pipefail
          ./gradlew ktlintCheck detekt test assembleDebug --console=plain 2>&1 | tee build/reports/dod/build.log
          ./gradlew lintDebug verifyModuleGraph :app:processReleaseMainManifest --console=plain 2>&1 | tee build/reports/dod/extra-checks.log
      - name: Dependency reports
        run: |
          set -o pipefail
          for module in parser dedup categorizer app; do
            ./gradlew :$module:dependencies --console=plain 2>&1 | tee build/reports/dod/$module-dependencies.txt
          done
      - name: Manifest and repository checks
        run: python3 .github/check_skeleton.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-lint-dod-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/intermediates/merged_manifests/**
            app/build/intermediates/merged_manifest/**
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    name: Install and launch debug APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v6
        with:
          name: debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/emulator_smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-evidence
          path: build/reports/emulator/
          if-no-files-found: error
