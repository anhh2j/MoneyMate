[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose = "1.12.1"
activity = "1.13.0"
junit = "4.13.2"
ktlint = "1.8.0"
detekt = "1.23.8"
jacoco = "0.8.15"

toolingBc = "1.86"
toolingJose4j = "0.9.7"
toolingJdom2 = "2.0.6.1"

[libraries]
b2-errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version = "2.36.0" }
b2-tracing = { module = "androidx.tracing:tracing", version = "1.1.0" }
b2-argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version = "1.6.0" }
b2-runner = { module = "androidx.test:runner", version = "1.7.0" }
b2-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
tooling-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "toolingBc" }
tooling-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "toolingBc" }
tooling-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "toolingBc" }
tooling-jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "toolingJose4j" }
tooling-jdom2 = { module = "org.jdom:jdom2", version.ref = "toolingJdom2" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
junit = { module = "junit:junit", version.ref = "junit" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
