name: Release publication
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full protected main SHA of merged candidate with successful post-merge CI
        required: true
        type: string
      version:
        description: Exact version approved by PO
        required: true
        type: string
      candidate_pr:
        description: Merged release-candidate PR number
        required: true
        type: string
      signer_sha256:
        description: PO-verified certificate SHA256 fingerprint (not a secret)
        required: true
        type: string
      confirmation:
        description: PUBLISH <version> @ <full source_sha>
        required: true
        type: string
permissions: {}
concurrency:
  group: release-publication
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_PR: ${{ inputs.candidate_pr }}
  SIGNER_SHA256: ${{ inputs.signer_sha256 }}
  RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.actor == 'anhh2j'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed before accessing signing secrets
        run: python3 scripts/release_control.py preflight --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" --pr "$RELEASE_PR" --signer "$SIGNER_SHA256"
  build-signed:
    needs: preflight
    if: vars.PUBLICATION_ENABLED == 'true'
    environment: moneymate-publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck SHA and protection after environment approval
        run: python3 scripts/release_control.py preflight --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" --pr "$RELEASE_PR" --signer "$SIGNER_SHA256"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
      - name: Install SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Sign only after PO environment approval
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ./gradlew --dependency-verification strict :app:assembleRelease --console=plain
      - name: Verify signed APK and checksum, no publication
        run: python3 scripts/release_control.py verify-apk --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" --pr "$RELEASE_PR" --signer "$SIGNER_SHA256" --apk app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v6
        with:
          name: approved-signed-apk
          path: app/build/outputs/apk/release/app-release.apk*
          if-no-files-found: error
  publish:
    needs: build-signed
    if: vars.PUBLICATION_ENABLED == 'true'
    environment: moneymate-publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: approved-signed-apk
          path: approved-apk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install APK verification tools
        run: |
          sdkmanager "build-tools;37.0.0"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Recheck SHA, CI, PR and signer before annotated tag and draft asset upload
        run: python3 scripts/release_control.py publish --sha "$SOURCE_SHA" --version "$RELEASE_VERSION" --pr "$RELEASE_PR" --signer "$SIGNER_SHA256" --apk approved-apk/app-release.apk
