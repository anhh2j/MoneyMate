name: T01 Spike Validation

on:
  pull_request:

permissions: {}

concurrency:
  group: t01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check formatting with pinned verified tool
        run: ./gradlew --dependency-verification strict ktlintCheck --console=plain
      - name: Build test artifacts with strict verification
        if: always()
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_t01_spike_checks.py' -v
          set -o pipefail
          mkdir -p build/reports/t01
          ./gradlew --dependency-verification strict :capture:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease lintDebug lintRelease verifyModuleGraph --console=plain 2>&1 | tee build/reports/t01/build.log
          python3 scripts/t01_spike_checks.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: t01-build-evidence
          path: |
            app/build/outputs/apk/
            **/build/test-results/
            **/build/reports/
          if-no-files-found: error
  runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 33, 35, 37]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v6
        with:
          name: t01-build-evidence
          path: .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/t01_spike_emulator.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: t01-runtime-api-${{ matrix.api }}
          path: build/reports/t01/
          if-no-files-found: error
