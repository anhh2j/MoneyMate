name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install commitlint
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            npx --no-install commitlint --last --verbose
          fi
      - name: Check docs
        run: |
          python3 scripts/check_docs.py
          python3 -m compileall -q scripts
      - name: Release bootstrap and publication safety regression (offline, no signing secrets)
        run: |
          mkdir -p build/reports/t00c
          set -o pipefail
          node --test scripts/tests/release_plan.test.cjs 2>&1 | tee build/reports/t00c/release-plan-tests.log
          python3 -m unittest discover -s scripts/tests -p 'test_release_*.py' -v 2>&1 | tee build/reports/t00c/release-control-tests.log
          python3 scripts/release_offline.py 2>&1 | tee build/reports/t00c/bootstrap-dry-run.log
      - name: T02 synthetic fixture contract and negative controls
        run: |
          mkdir -p build/reports/t02
          set -o pipefail
          python3 scripts/t02_fixture_checks.py --report build/reports/t02/fixture-validation.json 2>&1 | tee build/reports/t02/fixture-validation.log
          python3 -m unittest discover -s scripts/tests -p 'test_t02_fixture_checks.py' -v 2>&1 | tee build/reports/t02/selftests.log
      - name: Build and required checks
        run: |
          mkdir -p build/reports/dod
          set -o pipefail
          ./gradlew --dependency-verification strict ktlintCheck detekt test assembleDebug :build-logic:test --console=plain 2>&1 | tee build/reports/dod/build.log
          ./gradlew --dependency-verification strict lintDebug verifyModuleGraph :app:processReleaseMainManifest --console=plain 2>&1 | tee build/reports/dod/extra-checks.log
      - name: Dependency reports
        run: |
          set -o pipefail
          for module in parser dedup categorizer app; do
            ./gradlew --dependency-verification strict :$module:dependencies --console=plain 2>&1 | tee build/reports/dod/$module-dependencies.txt
          done
      - name: Export resolved dependency inventories
        run: ./gradlew --dependency-verification strict exportDependencyInventory --console=plain
      - name: Security gates (full history and resolved dependencies)
        run: |
          python3 scripts/install_security_tools.py "$RUNNER_TEMP/moneymate-tools"
          python3 scripts/security_scan.py --tools "$RUNNER_TEMP/moneymate-tools"
      - name: Negative controls and restore
        run: python3 scripts/check_negative_controls.py --tools "$RUNNER_TEMP/moneymate-tools"
      - name: Signed R8 dry-run
        run: python3 scripts/dry_run.py
      - name: T02 test fixture isolation from debug and release APKs
        run: |
          set -o pipefail
          python3 scripts/t02_fixture_checks.py --apk app/build/outputs/apk/debug/app-debug.apk --apk app/build/outputs/apk/release/app-release.apk --report build/reports/t02/apk-isolation.json 2>&1 | tee build/reports/t02/apk-isolation.log
      - name: Manifest and repository checks
        run: python3 .github/check_skeleton.py
      - name: Compare independent tooling graphs before and after B
        run: python3 scripts/t00b_review_evidence.py graph --tools "$RUNNER_TEMP/moneymate-tools"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-lint-dod-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/intermediates/merged_manifests/**
            app/build/intermediates/merged_manifest/**
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload disposable signed R8 APK
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

  emulator:
    permissions:
      contents: read
    name: Install and launch debug and R8 release APKs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v6
        with:
          name: debug-apk
          path: apk
      - uses: actions/download-artifact@v6
        with:
          name: release-dry-run-apk
          path: apk-release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            bash .github/emulator_smoke.sh apk/app-debug.apk debug
            adb uninstall com.app.moneymate
            bash .github/emulator_smoke.sh apk-release/app-release.apk release-r8
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-evidence
          path: build/reports/emulator/
          if-no-files-found: error

      - uses: actions/download-artifact@v6
        with:
          name: test-lint-dod-reports
          path: ${{ runner.temp }}/review-build-reports
      - name: Install verified scanner for review package
        run: python3 scripts/install_security_tools.py "$RUNNER_TEMP/moneymate-review-tools"
      - name: Package source and QA evidence (records outcome, not QA acceptance)
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/t00b_review_evidence.py package --tools "$RUNNER_TEMP/moneymate-review-tools" --reports "$RUNNER_TEMP/review-build-reports" --output "$RUNNER_TEMP/t00b-review"
      - name: Upload review package
        uses: actions/upload-artifact@v7
        with:
          name: source-review-package
          path: ${{ runner.temp }}/MoneyMate_T00b_REVIEW_*.zip*
          if-no-files-found: error

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          scopes: |
            capture
            parser
            dedup
            categorizer
            data
            privacy
            security
            app
            ci
            build
            docs
            adr
            deps
            release
          requireScope: true
          subjectPattern: ^.+$
